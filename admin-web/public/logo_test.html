<!DOCTYPE html>

        }

        img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }

        .name {
            word-break: break-all;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>

    <div class="item"><img src="/icons/van_real.png" />

    </div>
    <div class="item"><img src="/icons/neutral_source.png" />
